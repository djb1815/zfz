[tools]
rust = { version = "stable", profile = "minimal", components = [
  "rustfmt",
  "clippy",
  "rust-src",
  "rust-analyzer",
] }

[tasks.check]
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo test",
]

[tasks.build-release]
description = "Build an optimised release binary"
run = "cargo build --release"
